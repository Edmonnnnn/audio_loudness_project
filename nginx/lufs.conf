# /lufs → redirect на слэш
location = /lufs { return 308 /lufs/; }

# быстрый /lufs/health без бэкенда
location = /lufs/health {
  default_type text/plain;
  add_header Cache-Control "no-store";
  return 200 "OK\n";
}

# ===== API под префиксом /lufs/api → FastAPI (порт 8211)
location ^~ /lufs/api/ {
  client_max_body_size 200m;
  proxy_request_buffering off;
  proxy_buffering off;

  rewrite ^/lufs/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8211;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  proxy_connect_timeout 5s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;

  # чтобы HEAD не давал 405
  if ($request_method = HEAD) { return 200; }
}

# ===== ФРОНТ: раздаём файлы напрямую из FS (БЕЗ PM2, БЕЗ :3002)
location ^~ /lufs/ {
  alias /home/edmon/sites/lufs.bots-ai.net/frontend/;
  index index.html;
  # SPA/статик: если файла нет — отдаём индекс
  try_files $uri $uri/ /index.html;

  # кэш для ассетов
  location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
}

# --- LUFS compatibility shims (keep POST body; do not affect others) ---
location = /normalize  { return 307 /lufs/api/normalize; }
location = /normalize/ { return 307 /lufs/api/normalize; }
# --- end shims ---

# --- LUFS catch-all shim for legacy /normalize and /normalize/ ---
location ^~ /normalize {
    return 307 /lufs/api/normalize;
}
# --- end shim ---
include /etc/nginx/snippets/lufs_normalize_redirect.conf;

